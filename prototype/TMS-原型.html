function changeUnwrapAlgorithm(){const a=$('#unwrapAlgorithm').value;$('#unwrapLength').innerHTML=(a.startsWith('TDES-')?['16','24']:a.startsWith('AES-')?['16','24','32']:['']).map(n=>`<option value="${n}">${n?n+'字节':'请先选择算法'}</option>`).join('');renderKeyComponents();refreshKeyFileFormat();$('#upload').value=''}
function renderKeyComponents(){const n=Number($('#componentCount').value);$('#keyComponents').innerHTML=Array.from({length:n},(_,i)=>`<div class="form-grid key-component-row">${inputField('component'+i,'分量 '+(i+1),'','password',true).replace('<input','<input autocomplete="new-password" spellcheck="false"')}${inputField('componentKcv'+i,'分量 '+(i+1)+' KCV','','text',true)}</div>`).join('');$('#combinedKcv').value='';$('#componentResult').textContent='';}
function validateKeyComponents(){const a=$('#unwrapAlgorithm').value,n=Number($('#unwrapLength').value),count=Number($('#componentCount').value);if(!['TDES-ECB','TDES-CBC','AES-ECB','AES-CBC','AES-KW'].includes(a))return '请选择文件解密算法';if(!(a.startsWith('TDES-')?[16,24]:[16,24,32]).includes(n))return '请选择有效的解密密钥长度';if(![2,3].includes(count))return '分量数量须为2或3';const seen=new Set();for(let i=0;i<count;i++){const c=$('#component'+i).value.trim();if(!new RegExp('^[0-9a-f]{'+n*2+'}$','i').test(c))return '分量 '+(i+1)+' 须为'+n*2+'位十六进制';if(/^0+$/.test(c)||seen.has(c.toUpperCase()))return '分量不能全为零或相互重复';seen.add(c.toUpperCase());if(!/^[0-9a-f]{6}$/i.test($('#componentKcv'+i).value.trim()))return '请填写分量 '+(i+1)+' 的6位KCV';}if(!/^[0-9a-f]{6}$/i.test($('#combinedKcv').value.trim()))return '请填写6位合成密钥KCV';return '';}

function keyFileColumns(k,a){return ['SN',k==='TMK'?'TMK密文':k==='IPEK'?'IPEK密文':'FixedKey密文',...(k==='IPEK'?['KSN']:[]),...(a.endsWith('-CBC')?['IV']:[]),'KCV']}

function validateKeyFileRow(row,t,a){const cols=keyFileColumns(t.k,a);if(row.length!==cols.length||row.some(c=>!c.trim()))return '字段不完整';const cipher=row[1].trim();if(!/^(?:[0-9a-f]{2})+$/i.test(cipher))return '密文须为偶数位十六进制';const bytes=cipher.length/2;if(a==='AES-KW'?(bytes<24||bytes%8!==0):(bytes%(a.startsWith('TDES-')?8:16)!==0))return '密文长度不符合所选解密算法';if(!/^[0-9a-f]{6}$/i.test(row[cols.indexOf('KCV')].trim()))return 'KCV须为6位十六进制';if(t.ksn&&!/^(?:[0-9a-f]{20}|[0-9a-f]{24})$/i.test(row[cols.indexOf('KSN')].trim()))return 'KSN须为20或24位十六进制';if(a.endsWith('-CBC')&&!new RegExp('^[0-9a-f]{'+(a.startsWith('TDES-')?16:32)+'}$','i').test(row[cols.indexOf('IV')].trim()))return 'IV长度不符合所选解密算法';return '';}
async function saveKeyImport(){const v=formData();if(!v)return;const t=keyType(keyImport.type);const componentError=validateKeyComponents();if(componentError)return formError(componentError);v.importMode='密文';for(const k of Object.keys(v))if(k.startsWith('component')&&k!=='componentCount'||k==='combinedKcv')delete v[k];

try{if(!/\.csv$/i.test(file.name)||file.size>5*1024*1024)throw Error('请选择5MB以内的CSV文件');
const rows=parseCSV(await file.text()).filter(r=>r.some(c=>c.trim()));const expected=keyFileColumns(t.k,v.unwrapAlgorithm);const header=rows.shift()||[];if(header.map(x=>x.replace(/^\uFEFF/,'').trim()).join(',')!==expected.join(','))throw Error('文件表头不匹配，请下载当前类型和算法的模板');if(!rows.length||rows.length>10000)throw Error('文件须包含1至10000条记录');

const ok=results.filter(r=>!r.reason);if(!ok.length)throw Error('无有效记录：'+results[0].reason);
const rec={id:'k'+(++demoId),type:t.k,typeName:t.name,system:t.system,index:v.index.toUpperCase(),version:'K'+Date.now(),importMode:'密文',unwrapAlgorithm:v.unwrapAlgorithm,unwrapLength:v.unwrapLength,componentCount:v.componentCount,org:me().org,name:t.name+' · '+now()+' · '+demoId,remark:v.remark,status:'可用',created:now(),demo:true};db.keys.unshift(rec);ok.forEach(r=>db.keyItems.push({id:'ki'+(++demoId),keyId:rec.id,sn:r.sn,org:r.org,index:rec.index,kcv:r.kcv,ksn:r.ksn,status:'待下发',created:now()}));audit('演示导入密钥：'+rec.name,'密钥管理',me().org,{action:'导入',objectId:rec.id,objectName:rec.name});closeLayer();render();layer('导入结果（演示）',`<div class="notice">格式校验通过 ${ok.length} 条，失败 ${results.length-ok.length} 条。未执行解密、KCV计算或真实密钥入库。</div>${tableRows(results.map(r=>({sn:r.sn,result:r.reason?'失败':'格式通过',reason:r.reason||'—'})),[['sn','设备SN'],['result','结果'],['reason','原因']],()=>'—')}`,btn('关闭','closeLayer()'),'wide');
}catch(e){formError(e.message)}}

function previewInventory(){const s=inventoryState,type=s.type;s.preview=[];$('#inventoryPreview').innerHTML='';$('#invError').textContent='';if(!$('#inventoryForm').reportValidity())return;try{let input=[];if(type==='号段入库')input=buildRangeInput(s.ranges,{model:$('#invModel').value,kernel:$('#invKernel').value,app:$('#invApp').value,params:$('#invParams').value});else if(type==='批量入库')input=parseImport();else{if(devicePicker.dirty)throw Error('SN清单已修改，请先点击“匹配并添加”');input=devicePicker.ids.map(id=>({sn:db.devices.find(d=>d.id===id)?.sn})).concat(devicePicker.unmatched.map(sn=>({sn})));}if(!input.length)throw Error('请先添加设备或导入数据');s.target=['退货回收','号段入库','批量入库'].includes(type)?'p':$('#invTarget')?.value||me().org;s.remark=$('#invRemark').value;s.preview=validateInventoryInput(input,type,s.target);const ok=s.preview.filter(x=>x.status==='成功').length;$('#inventoryPreview').innerHTML=`<div class="preview-title"><h3>校验结果</h3><span>共 ${s.preview.length} 台</span><b class="good">可处理 ${ok} 台</b><b class="bad">失败 ${s.preview.length-ok} 台</b></div><div class="table-wrap validation-table"><table><thead><tr>${type==='号段入库'?'<th>号段</th>':''}<th>SN</th><th>结果</th><th>说明</th></tr></thead><tbody>${s.preview.map(x=>`<tr>${type==='号段入库'?`<td>${x.sourceRange}</td>`:''}<td>${esc(x.sn)}</td><td>${badge(x.status)}</td><td>${esc(x.reason)}</td></tr>`).join('')}</tbody></table></div>${ok!==s.preview.length?'<p class="sub">仅处理校验通过的设备，失败设备保留原状态。</p>':''}`;}catch(e){$('#invError').textContent=e.message}}
function commitInventory(){const s=inventoryState;if(!s.preview.length)return toast('请先校验并预览设备');previewInventory();if($('#invError').textContent||!s.preview.length)return;const ok=s.preview.filter(x=>x.status==='成功');if(!ok.length)return toast('没有可处理设备，请修正失败原因');for(const x of ok){if(['号段入库','批量入库'].includes(s.type)){const id='d'+(++demoId);db.devices.push({...x,id,org:'p',stock:'在库',activation:'未激活',mode:'',tamper:'未触发',remark:x.remark||s.remark,factory:`Kernel ${x.kernel||'—'} / APP ${x.app||'—'} / 参数 ${x.params||'—'}`,last:'—',created:now()});x.id=id;}else{const d=db.devices.find(d=>d.id===x.id);if(s.type==='设备报废'){d.stock='报废';d.scrapReason=s.remark;d.scrappedAt=now();}else{if(s.type==='设备出库')d.activation='未激活';d.org=s.target;d.stock=s.target==='p'?'在库':'已出库';}}}const rec={id:'op'+(++demoId),batch:now().slice(0,10).replaceAll('-','')+String(demoId).padStart(6,'0'),type:s.type,org:me().org,target:s.type==='设备报废'?'保持原归属':s.target,total:s.preview.length,success:ok.length,fail:s.preview.length-ok.length,status:ok.length===s.preview.length?'成功':'部分成功',operator:me().name,created:now(),remark:s.remark,details:s.preview.map(x=>({sn:x.sn,fromOrg:x.fromOrg,toOrg:x.status==='成功'?x.toOrg:x.fromOrg,status:x.status,reason:x.status==='成功'?'—':x.reason})),moved:ok.map(x=>x.id)};db.operations.unshift(rec);audit(s.type+'：'+ok.length+'台');selected.clear();closeLayer();navigate('operations');showDetail('operations',rec.id);toast('批量处理完成')}
